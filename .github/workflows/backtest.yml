name: Backtest

# The scheduled worker. GitHub Actions is the cron, the repository is the
# datastore, and the commit is the audit trail — no service to provision and no
# credential to hold, which is the same constraint the rest of the project runs
# under.
#
# Every run appends one line to data/backtest.jsonl and commits it. A claim the
# site makes about routing quality is therefore always traceable to the diff
# that introduced it.
on:
  schedule:
    # Every six hours. Public RPC serves roughly three thousand blocks of logs,
    # which is a few hours of Base — running more often would resample blocks
    # the previous run already covered.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      span:
        description: 'Blocks to scan on Base'
        default: '2800'
      samples:
        description: 'Trades to replay'
        default: '40'

# Two runs appending to the same file would race on the push.
concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Replay recent Base swaps
        run: npm run backtest -- ${{ inputs.span || '2800' }} ${{ inputs.samples || '40' }}

      # Its RPC keeps about ten minutes of state, so the window is fixed well
      # inside that. A failure here must not throw away the Base run above.
      - name: Replay recent Robinhood Chain swaps
        continue-on-error: true
        run: npm run backtest -- robinhood 4000 ${{ inputs.samples || '40' }}

      # X Layer serves a hundred blocks per log query, so this scan is a few
      # dozen passes rather than one.
      - name: Replay recent X Layer swaps
        continue-on-error: true
        run: npm run backtest -- xlayer 2000 ${{ inputs.samples || '40' }}

      - name: Commit the dataset
        run: |
          set -euo pipefail
          if git diff --quiet -- data/backtest.jsonl; then
            echo "no new samples recorded"
            exit 0
          fi
          git config user.name  "pathiel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.jsonl
          RUNS=$(wc -l < data/backtest.jsonl | tr -d ' ')
          git commit -m "data: backtest run ${RUNS}

          Replayed real Base, Robinhood Chain and X Layer swaps against the router. Appended by
          .github/workflows/backtest.yml; see /backtest for the aggregate."
          # A scheduled job that fails because someone pushed while it ran is
          # noise, not a signal. Rebase and retry once.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
